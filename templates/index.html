<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <title>Tournament Generator</title>
</head>

<body class="home-body">

    <div class="title">
        <h1>CREATE YOUR TOURNAMENT</h1>
    </div>

    <div class="list-buttons">
        <form class="form-list" method="POST">
            <input class="text-input" type="text" name="name" autocomplete="off" placeholder="Enter name...">
            <button class="form-button" type="submit" name="action" value="add">Add</button>
            <button class="form-button" type="submit" name="action" value="clear">Clear</button>
            <button class="form-button" type="submit" name="action" value="generate">Generate
                Bracket</button>
            <button class="form-button" class="button" type="submit" name="action" value="delete"
                id="delete-bracket">Delete
                Bracket</button>
        </form>
    </div>

    <div class="simulation">
        <form action="/simulation" class="form-simulation" method="post">
            <button class="button" type="submit" name="simulation" value="start">Start Simulation</button>
        </form>
    </div>

    {{if .Error}}
    <div class="error-message">
        {{.Error}}
    </div>
    {{end}}

    <div class="list">
        <div class="list-title">Players</div>
        {{range .Names}}
        <div>{{.}}</div>
        {{end}}
    </div>

    <div class="bracket">
        {{if .GenerateBracket}}
        {{range .Rounds}}
        <div class="bracket-column-match">
            {{range .}}
            <div class="bracket-match">
                {{range .}}
                <div class="match">{{.}}</div>
                {{end}}
            </div>
            {{end}}
        </div>
        {{end}}
        {{end}}
    </div>

</body>

</html>
