<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="/assets/js/script.js"></script>

    <title>Bracket Generator</title>
</head>

<body>

    <div class="title">
        <h1>CREATE YOUR TOURNAMENT</h1>
    </div>

    <div class="list">
        <div class="list-title">Players</div>
        {{range .Names}}
        <div>{{.}}</div>
        {{end}}
    </div>

    {{if .GenerateBracket}}
    <div class="bracket">
        {{range .Rounds}}
        <div class="bracket-column-match" id="bracket">
            {{range .}}
            <div class="bracket-match">
                {{range .}}
                <form method="post">
                    <button type="submit" name="winner" value="{{.}}" class="match">{{.}}</button>
                </form>
                {{end}}
            </div>
            {{end}}
        </div>
        {{end}}
    </div>
    {{end}}

    <div class="form-list">
        <form method="POST">
            <input class="text-input" type="text" name="name" placeholder="Enter name...">
            <button class="button" type="submit" name="action" value="add">Add</button>
            <button class="button" type="submit" name="action" value="clear">Clear</button>
            <button class="button" type="submit" name="action" value="generate">Generate Bracket</button>
            <button class="button" type="submit" name="action" value="delete" id="delete-bracket">Delete
                Bracket</button>
        </form>
    </div>

    {{if .Error}}
    <div class="error-message">
        {{.Error}}
    </div>
    {{end}}

</body>

</html>
