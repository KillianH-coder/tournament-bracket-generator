<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Tournament Simulation</title>
</head>

<body>
    <h1>Simulation</h1>

    <div class="bracket">
        {{if .StartSimulation}}
        {{range .Rounds}}
        <div class="bracket-column-match" id="bracket">
            {{range .}}
            <div class="bracket-match">
                {{range .}}
                <div class="match">{{.}}</div>
                {{end}}
            </div>
            {{end}}
        </div>
        {{end}}
        {{end}}
    </div>

</body>

</html>
