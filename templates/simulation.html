<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament</title>
</head>

<body>
    <h1>Simulation</h1>

    {{if .StartSimulation}}
    <div class="bracket">
        {{range .Rounds}}
        <div class="bracket-column-match" id="bracket">
            {{range .}}
            <div class="bracket-match">
                {{range .}}
                <!-- <form method="post">
                    <button type="submit" name="winner" value="{{.}}" class="match">{{.}}</button>
                </form> -->
                <div class="match">{{.}}</div>
                {{end}}
            </div>
            {{end}}
        </div>
        {{end}}
    </div>
    {{end}}

</body>

</html>
